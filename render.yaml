services:
  - type: web
    name: floormap-web
    runtime: ruby
    runtimeVersion: 3.3.0
    buildCommand: bundle install && bundle exec rails assets:precompile && bundle exec rails db:migrate
    startCommand: bundle exec puma -t 5:5 -p 3000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: floormap-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: floormap-redis
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: true
      - key: RAILS_SERVE_STATIC_FILES
        value: true

  - type: postgres
    name: floormap-db
    ipAllowList: []
    plan: starter

  - type: redis
    name: floormap-redis
    ipAllowList: []
    plan: starter
