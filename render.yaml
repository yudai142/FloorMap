services:
  - type: web
    name: floormap-web
    runtime: ruby
    runtimeVersion: "3.3.0"
    buildCommand: bundle install && npm ci
    startCommand: bash bin/render-start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: floormap-redis
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_MASTER_KEY
        sync: false

  - type: postgres
    name: floormap-db
    ipAllowList: []
    plan: starter

  - type: redis
    name: floormap-redis
    ipAllowList: []
    plan: starter
